name: News Bot

on:
  schedule:
    # Runs every 30 minutes. Adjust as you like (cron is UTC).
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  check-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit seen.json back
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TYPHOON_API_KEY: ${{ secrets.TYPHOON_API_KEY }}
        run: python bot.py

      - name: Persist seen.json
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "Update seen articles"
          git push
